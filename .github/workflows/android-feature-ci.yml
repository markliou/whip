name: Android Feature CI

on:
  push:
    branches:
      - feat/android-agent-widget
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-feature-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: production

jobs:
  android:
    name: Lint and build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: >-
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-36"
          "build-tools;36.0.0"
          "ndk;27.1.12297006"
          "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Install JavaScript dependencies
        run: npm ci --include=dev

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Lint JavaScript and TypeScript
        run: npm run lint

      - name: Android lint and debug build
        run: >-
          nix develop .#default -c
          android/gradlew -p android
          app:lintDebug app:assembleDebug
          -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=512m"
          -PreactNativeArchitectures=arm64-v8a
          --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: whip-android-widget-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
